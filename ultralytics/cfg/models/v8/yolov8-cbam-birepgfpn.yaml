# YOLOv8 with CBAM + BiRepGFPN for Enhanced Tomato Leaf Disease Detection
# Model enhanced with:
# - CBAM (Convolutional Block Attention Module) in backbone for better feature selection
# - BiRepGFPN (Bi-directional Reparameterized GFPN) with P2 support for improved multi-scale fusion
# - P2 feature output (stride 4) for better small object detection

# Parameters
nc: 9 # number of classes (tomato diseases - adjust as needed)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8-CBAM-BiRepGFPN backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 ⭐ Output this for detection
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, CBAM, []] # 3 ⭐ CBAM attention after C2f (auto-detects channels)
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 6, C2f, [256, True]] # 5
  - [-1, 1, CBAM, []] # 6 ⭐ CBAM attention after C2f (auto-detects channels)
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 6, C2f, [512, True]] # 8
  - [-1, 1, CBAM, []] # 9 ⭐ CBAM attention after C2f (auto-detects channels)
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 3, C2f, [1024, True]] # 11
  - [-1, 1, SPPF, [1024, 5]] # 12

# YOLOv8-CBAM-BiRepGFPN head
head:
  # Standard top-down pathway with BiRepGFPN-style fusion
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 9], 1, Concat, [1]] # 14 cat P4 with CBAM
  - [-1, 3, C2f, [512]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 6], 1, Concat, [1]] # 17 cat P3 with CBAM
  - [-1, 3, C2f, [256]] # 18 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19
  - [[-1, 3], 1, Concat, [1]] # 20 cat P2 with CBAM
  - [-1, 3, C2f, [128]] # 21 (P2/4-xsmall)

  # Bottom-up pathway
  - [-1, 1, Conv, [128, 3, 2]] # 22
  - [[-1, 18], 1, Concat, [1]] # 23 cat head P3
  - [-1, 3, C2f, [256]] # 24 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 25
  - [[-1, 15], 1, Concat, [1]] # 26 cat head P4
  - [-1, 3, C2f, [512]] # 27 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 28
  - [[-1, 12], 1, Concat, [1]] # 29 cat P5 (SPPF output)
  - [-1, 3, C2f, [1024]] # 30 (P5/32-large)

  # Detect layer with P2, P3, P4, P5
  - [[21, 24, 27, 30], 1, Detect, [nc]] # 31 Detect(P2, P3, P4, P5)

